name: CI

# Tests on every PR and push; the Docker image is built and smoke-tested every
# time, but only pushed to Docker Hub from main (and v* tags).
#
# Required repo secrets (same as ccc-gathered):
#   DOCKER_HUB_USERNAME, DOCKER_HUB_ACCESS_TOKEN

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ccc-mission-board

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually runs (native sharp binary, static web build,
      # server deps present) against the built-in fictional fixture — no
      # Gathered, no secrets.
      - name: Smoke test (mock mode)
        run: |
          docker run -d --name board -p 8080:8080 \
            -e MOCK_GATHERED=1 -e VIEWER_ALLOWED_NETWORKS=0.0.0.0/0 \
            "$IMAGE_NAME:ci"
          for i in $(seq 1 30); do
            curl -sf localhost:8080/healthz | jq -e '.ok' >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8080/healthz | jq -e '.ok and .missionaryCount > 0'
          img=$(curl -sf localhost:8080/api/board | jq -r '[.missionaries[] | select(.photo)][0].photo.thumb')
          test "$(curl -s -o /dev/null -w '%{content_type}' "localhost:8080$img")" = "image/webp"
          curl -sf localhost:8080/ | grep -q '<title>Missionary Board</title>'

      - name: Container logs
        if: failure()
        run: docker logs board || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # <user>/ccc-mission-board:<commit sha>, :latest on main, :1.2.3 on v1.2.3
      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Push to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
