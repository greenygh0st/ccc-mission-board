# Example deployment next to Gathered, behind the proxy manager and Cloudflare.
#
#   kiosk ─► Cloudflare ─► church WAN (12.189.82.18) ─► proxy manager ─► this container
#   this container ─► Cloudflare ─► church WAN ─► proxy manager ─► Gathered
#
# In Gathered → Settings → Integrations → Missionary Board, allow 12.189.82.18.
# No host ports are published: the proxy manager reaches the container on its
# Docker network.

services:
  mission-board:
    # Published by GitHub Actions (.github/workflows/ci.yml) on every push to main.
    # Pin a commit SHA tag instead of :latest if you want deploys to be explicit.
    image: <dockerhub-user>/ccc-mission-board:latest
    restart: unless-stopped
    env_file: .env # GATHERED_BOARD_TOKEN lives here
    environment:
      GATHERED_BASE_URL: https://gathered.cccyukon.org
      VIEWER_ALLOWED_NETWORKS: 12.189.82.18
      TRUST_PROXY: 172.30.50.2 # the proxy manager's address on the `proxy` network
      TRUST_CLOUDFLARE: "1"
    volumes:
      - mission-board-data:/data
    networks:
      - proxy

networks:
  # The network your proxy manager uses to reach its upstreams. Give the proxy
  # manager a fixed IP on it so TRUST_PROXY is stable.
  proxy:
    external: true

volumes:
  mission-board-data:
